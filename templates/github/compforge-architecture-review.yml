# Copy this file to your frontend as
# .github/workflows/compforge-architecture-review.yml
# Keep both refs pinned to the same released tag.
# Non-blocking: never fails the PR check.

name: Compforge architecture review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  architecture-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    uses: LooSung/compforge/.github/workflows/reusable-architecture-review.yml@v1.3.3
    with:
      compforge_ref: v1.3.3
