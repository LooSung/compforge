name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-skills:
    name: Skill lint (frontmatter + 200-line limit + doc links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/setup/bootstrap.sh
          bash -n scripts/setup/install.sh
          bash -n scripts/setup/uninstall.sh
          bash -n scripts/setup/doctor.sh
          bash -n scripts/setup/init.sh
          bash -n scripts/setup/lib/common.sh
          bash -n scripts/setup/lib/init-core.sh
          bash -n scripts/setup/lib/init-delivery.sh
          bash -n scripts/setup/lib/init-selftest.sh
          bash -n scripts/ci/lint-skills.sh
          bash -n scripts/ci/smoke-test.sh
          bash -n scripts/ci/init-smoke.sh
          bash -n scripts/ci/harness-smoke.sh
          bash -n scripts/ci/harness/probes.sh
          bash -n scripts/proof/run-comparison.sh
      - name: Lint skills and repository
        run: |
          chmod +x scripts/ci/lint-skills.sh
          ./scripts/ci/lint-skills.sh
          python3 scripts/ci/check-maintained-file-sizes.py
      - name: Self-test documentation links
        run: python3 scripts/ci/test-doc-links.py
      - name: Self-test hard timeout runner
        run: python3 scripts/ci/test-run-with-timeout.py
      - name: Static harness packaging
        run: ./scripts/ci/harness-smoke.sh static
      - name: Self-test harness activation isolation
        run: python3 scripts/ci/test-harness-smoke.py
      - name: Self-test proof tooling
        run: |
          python3 scripts/proof/test-evaluate-run.py
          python3 scripts/proof/test-proof-runner.py
          python3 scripts/proof/test-rescore-published.py
      - name: Self-test architecture review
        run: |
          python3 scripts/ci/test-review.py
          python3 scripts/ci/test-review-a11y.py

  doctor:
    name: Pack structure (doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doctor against the repo pack
        run: bash scripts/setup/doctor.sh

  smoke:
    name: Isolated-HOME install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          chmod +x scripts/ci/smoke-test.sh scripts/setup/*.sh
          ./scripts/ci/smoke-test.sh
