name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-skills:
    name: Skill lint (frontmatter + 200-line limit + doc links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/setup/bootstrap.sh
          bash -n scripts/setup/install.sh
          bash -n scripts/setup/uninstall.sh
          bash -n scripts/setup/doctor.sh
          bash -n scripts/setup/init.sh
          bash -n scripts/setup/lib/common.sh
          bash -n scripts/ci/lint-skills.sh
          bash -n scripts/ci/smoke-test.sh
      - name: Lint skills and repository
        run: |
          chmod +x scripts/ci/lint-skills.sh
          ./scripts/ci/lint-skills.sh
      - name: Self-test documentation links
        run: python3 scripts/ci/test-doc-links.py

  doctor:
    name: Pack structure (doctor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doctor against the repo pack
        run: bash scripts/setup/doctor.sh

  smoke:
    name: Isolated-HOME install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          chmod +x scripts/ci/smoke-test.sh scripts/setup/*.sh
          ./scripts/ci/smoke-test.sh
