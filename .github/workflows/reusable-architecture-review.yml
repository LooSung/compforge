name: Compforge architecture review

# Reusable workflow for a target frontend. The caller is the project under
# review; this job fetches the pack only to run scripts/ci/review.

on:
  workflow_call:
    inputs:
      compforge_ref:
        description: Compforge ref that provides the reviewer
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  architecture-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Compforge reviewer
        uses: actions/checkout@v4
        with:
          repository: LooSung/compforge
          ref: ${{ inputs.compforge_ref }}
          path: .compforge-reviewer

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run architecture review
        run: |
          PYTHONPATH="$PWD/.compforge-reviewer/scripts/ci" python3 -m review.main \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --root "$PWD" \
            --comment-out review-summary.md \
            --json-out review-findings.json \
            --correction-out review-correction.md

      - name: Upload machine-readable findings
        uses: actions/upload-artifact@v4
        with:
          name: architecture-review-findings
          path: |
            review-findings.json
            review-correction.md

      - name: Upsert PR summary comment
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-summary.md', 'utf8');
            const marker = '<!-- compforge-architecture-review -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(
              c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }
